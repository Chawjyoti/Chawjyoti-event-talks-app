
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talks Today</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background-color: #fff;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }
        header h1 {
            margin: 0;
            color: #333;
            font-size: 2.5em;
        }
        .search-container {
            margin: 20px 0;
            text-align: center;
        }
        #search-box {
            padding: 10px;
            width: 50%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        .schedule {
            margin-top: 20px;
        }
        .talk {
            background-color: #fff;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 5px;
            border-left: 5px solid #007bff;
            transition: all 0.3s ease;
        }
        .talk:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .talk h2 {
            margin-top: 0;
            color: #007bff;
        }
        .talk-meta {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
        }
        .talk-meta span {
            margin-right: 15px;
        }
        .talk-description {
            font-size: 1em;
            line-height: 1.6;
        }
        .break {
            background-color: #e9ecef;
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            border-left: 5px solid #6c757d;
        }
        .category-tag {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tech Talks Today</h1>
    </header>

    <div class="container">
        <div class="search-container">
            <input type="text" id="search-box" placeholder="Search by category...">
        </div>

        <div id="schedule-container" class="schedule"></div>
    </div>

    <script>
        const talks = [
            {
                title: "The Future of Artificial Intelligence",
                speakers: ["Alex Doe"],
                category: ["AI", "Machine Learning"],
                description: "A deep dive into the future of AI and its impact on society."
            },
            {
                title: "Building Scalable Web Applications",
                speakers: ["Jane Smith", "John Appleseed"],
                category: ["Web Development", "Scalability"],
                description: "Learn how to build web applications that can handle millions of users."
            },
            {
                title: "Cybersecurity in a Post-Quantum World",
                speakers: ["Emily White"],
                category: ["Cybersecurity", "Quantum Computing"],
                description: "Exploring the challenges and solutions for cybersecurity in the age of quantum computers."
            },
            {
                title: "The Rise of Serverless Architectures",
                speakers: ["Michael Johnson"],
                category: ["Serverless", "Cloud Computing"],
                description: "An overview of serverless computing and how it is changing the way we build applications."
            },
            {
                title: "Introduction to Blockchain and Cryptocurrencies",
                speakers: ["David Green", "Sarah Black"],
                category: ["Blockchain", "Finance"],
                description: "A beginner-friendly introduction to the world of blockchain and cryptocurrencies."
            },
            {
                title: "Human-Computer Interaction: Designing for the Future",
                speakers: ["Chris Lee"],
                category: ["HCI", "UX/UI"],
                description: "Discover the principles of designing intuitive and effective user interfaces."
            }
        ];

        function renderTalks(filter = "") {
            const scheduleContainer = document.getElementById('schedule-container');
            scheduleContainer.innerHTML = '';
            let currentTime = new Date();
            currentTime.setHours(10, 0, 0, 0);

            const filteredTalks = talks.filter(talk => 
                talk.category.some(cat => cat.toLowerCase().includes(filter.toLowerCase()))
            );

            let talkCounter = 0;
            talks.forEach((talk, index) => {
                const startTime = new Date(currentTime);
                const endTime = new Date(startTime.getTime() + 60 * 60 * 1000);
                
                const talkVisible = filteredTalks.includes(talk);

                const talkElement = document.createElement('div');
                if (talkVisible) {
                    talkElement.classList.add('talk');
                } else {
                    talkElement.classList.add('talk');
                    talkElement.style.display = 'none';
                }

                talkElement.innerHTML = `
                    <div class="talk-meta">
                        <span>${startTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${endTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                    <h2>${talk.title}</h2>
                    <div class="talk-meta">
                        <span><strong>Speakers:</strong> ${talk.speakers.join(', ')}</span>
                    </div>
                    <div class="talk-meta">
                        ${talk.category.map(cat => `<span class="category-tag">${cat}</span>`).join('')}
                    </div>
                    <p class="talk-description">${talk.description}</p>
                `;
                scheduleContainer.appendChild(talkElement);

                currentTime.setMinutes(currentTime.getMinutes() + 60 + 10);
                talkCounter++;

                if (talkCounter === 3) {
                    const lunchBreak = document.createElement('div');
                    lunchBreak.classList.add('break');
                    const lunchStartTime = new Date(currentTime.getTime() - 10 * 60 * 1000);
                    const lunchEndTime = new Date(lunchStartTime.getTime() + 60 * 60 * 1000);
                    lunchBreak.innerHTML = `<h3>Lunch Break</h3><p>${lunchStartTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${lunchEndTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>`;
                    scheduleContainer.appendChild(lunchBreak);
                    currentTime = new Date(lunchEndTime);
                }
            });
        }
        
        document.getElementById('search-box').addEventListener('input', (event) => {
            renderTalks(event.target.value);
        });

        renderTalks();
    </script>

</body>
</html>
